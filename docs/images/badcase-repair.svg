<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Bad Case 真实结果与修复计划预览</title>
  <desc id="desc">左侧展示真实 CLI Bad Case 的统计和问题类型，右侧展示系统生成但尚未执行的六条修复计划。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08121b"/><stop offset="1" stop-color="#10222d"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="12" stdDeviation="18" flood-opacity=".3"/></filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#708993"/></marker>
    <style>.sans{font-family:Arial,'Microsoft YaHei',sans-serif}.mono{font-family:Consolas,monospace}.tiny{font-size:12px}.body{font-size:14px}.heading{font-size:18px;font-weight:700}.title{font-size:29px;font-weight:700}.bright{fill:#eef8f6}.muted{fill:#879ca1}</style>
  </defs>
  <rect width="1200" height="675" rx="24" fill="url(#bg)"/>
  <text x="62" y="68" class="sans body" font-weight="700" letter-spacing="2" fill="#6d8991">BAD CASE · REAL CLI RESULT · REPAIR PLAN ONLY</text>
  <text x="62" y="110" class="sans title bright">先暴露问题，再给出待人工确认的修复计划</text>

  <g filter="url(#shadow)">
    <rect x="62" y="150" width="500" height="460" rx="18" fill="#171a24" stroke="#663541"/>
    <rect x="88" y="176" width="128" height="32" rx="16" fill="#ff7185" opacity=".1" stroke="#ff7185"/><circle cx="106" cy="192" r="5" fill="#ff7185"/><text x="122" y="197" class="sans body" font-weight="700" fill="#ffc1c9">CLI / FAIL</text>
    <text x="88" y="246" class="sans heading bright">真实统计</text>
    <g class="sans body"><text x="88" y="280" class="muted">上下文</text><text x="228" y="280" fill="#f5c882">1 条 · score 0 · confidence low</text><text x="88" y="312" class="muted">图结构</text><text x="228" y="312" class="bright">4 节点 · 2 边 · 可达 1</text><text x="88" y="344" class="muted">分支覆盖</text><text x="228" y="344" class="bright">1 个选择 · 0 个失败节点</text><text x="88" y="376" class="muted">变量</text><text x="228" y="376" class="bright">1 个 · 完整 0</text><text x="88" y="408" class="muted">质量门</text><text x="228" y="408" fill="#ff9aaa">3 hard fail · 1 review flag</text></g>
    <path d="M88 431H536" stroke="#493039"/>
    <text x="88" y="465" class="sans heading bright">问题代码与数量</text>
    <g class="mono tiny"><text x="88" y="497" fill="#ff9aaa">DANGLING_EDGE × 1</text><text x="312" y="497" fill="#ff9aaa">CHOICE_ARITY × 1</text><text x="88" y="525" fill="#ff9aaa">CHOICE_FAILURE_COVERAGE × 1</text><text x="360" y="525" fill="#ff9aaa">DEAD_END × 1</text><text x="88" y="553" fill="#ff9aaa">UNREACHABLE_NODE × 3</text><text x="312" y="553" fill="#ff9aaa">VARIABLE_NODE_MISSING × 1</text><text x="88" y="581" fill="#ff9aaa">VARIABLE_LIFECYCLE_INCOMPLETE × 2</text></g>

    <rect x="638" y="150" width="500" height="460" rx="18" fill="#211f17" stroke="#66512e"/>
    <rect x="664" y="176" width="190" height="32" rx="16" fill="#ffbf66" opacity=".1" stroke="#ffbf66"/><circle cx="682" cy="192" r="5" fill="#ffbf66"/><text x="698" y="197" class="sans body" font-weight="700" fill="#ffdda9">REPAIR PLAN / PREVIEW</text>
    <text x="664" y="246" class="sans heading bright">已生成 6 条计划，但未执行</text>
    <g class="sans body"><g transform="translate(664 272)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">01　补充或重标合成证据，然后重跑选择</text></g><g transform="translate(664 326)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">02　替换指向不存在节点的转移</text></g><g transform="translate(664 380)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">03　连接或移除不可达节点</text></g><g transform="translate(664 434)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">04　为死路补转移或标记终点/失败</text></g><g transform="translate(664 488)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">05　选择至少两支，且含显式失败路径</text></g><g transform="translate(664 542)"><rect width="448" height="44" rx="10" fill="#2b281d" stroke="#5c4d30"/><text x="16" y="27" fill="#ffe0ad">06　补全 set/read/payoff/settlement 后重跑</text></g></g>
  </g>
  <path d="M578 370H622" stroke="#708993" stroke-width="3" marker-end="url(#arr)"/><text x="600" y="348" text-anchor="middle" class="sans tiny" fill="#a8bdc0">生成计划</text>
  <rect x="62" y="627" width="1076" height="1" fill="#263f49"/><text x="62" y="653" class="sans body" fill="#ffcf86">待人工确认并修改输入后重新运行；当前回执仍为 FAIL，系统没有自动修复。</text>
</svg>
