<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="改编策略影游母体">
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/></marker><style>
  .bg{fill:#F6F7F9}.surface{fill:#FFFFFF}.surface2{fill:#FAFBFC}.ink{fill:#111827}.muted{fill:#6B7280}.subtle{fill:#9CA3AF}.border{stroke:#E5E7EB;stroke-width:1}.border2{stroke:#D1D5DB;stroke-width:1}.accent{fill:#3366FF}.accentText{fill:#3366FF}.accentSoft{fill:#EAF0FF}.success{fill:#10B981}.successSoft{fill:#EAFBF4}.warning{fill:#F59E0B}.warningSoft{fill:#FFF7E6}.danger{fill:#EF4444}.dangerSoft{fill:#FEECEC}.purple{fill:#7C3AED}.purpleSoft{fill:#F2ECFF}.cyan{fill:#06B6D4}.cyanSoft{fill:#E9FBFF}.line{stroke:#CBD5E1;stroke-width:2}.thin{stroke:#E5E7EB;stroke-width:1}.dash{stroke-dasharray:6 6}.shadow{filter:url(#softShadow)}
  text{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;dominant-baseline:alphabetic}
  .h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px;font-weight:400}.small{font-size:12px}.tiny{font-size:11px}.nav{font-size:13px}.mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;font-size:12px}
</style></defs>
<g id="改编策略影游母体">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="273" class="nav accentText" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">改编策略 / 影游母体</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="1084" height="180" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">改编方向画布</text><text x="306" y="166" class="small muted" text-anchor="start">保留核心张力，重写不适合影游化的部分</text><rect x="314" y="174" width="292" height="76" rx="18" class="successSoft" /><text x="336" y="204" class="h3 success" text-anchor="start">必须保留</text><text x="336" y="232" class="small ink" text-anchor="start">核心反转、人物秘密、密信线索</text><rect x="654" y="174" width="292" height="76" rx="18" class="accentSoft" /><text x="676" y="204" class="h3 accentText" text-anchor="start">建议扩展</text><text x="676" y="232" class="small ink" text-anchor="start">并行行动、私下交易、延迟后果</text><rect x="994" y="174" width="292" height="76" rx="18" class="dangerSoft" /><text x="1016" y="204" class="h3 danger" text-anchor="start">必须重写</text><text x="1016" y="232" class="small ink" text-anchor="start">主持人解释、纯口头推理、无反馈选择</text><rect x="282" y="324" width="520" height="520" rx="20" class="surface border shadow" /><text x="306" y="358" class="h3 ink" text-anchor="start">互动化机会</text><text x="306" y="382" class="small muted" text-anchor="start">哪些内容适合变成选择节点</text><rect x="314" y="390" width="452" height="66" rx="16" class="surface2 border" /><text x="338" y="417" class="h3 ink" text-anchor="start">线索发现</text><text x="338" y="440" class="small muted" text-anchor="start">从固定展示改成角色权限触发</text><rect x="314" y="482" width="452" height="66" rx="16" class="surface2 border" /><text x="338" y="509" class="h3 ink" text-anchor="start">身份暴露</text><text x="338" y="532" class="small muted" text-anchor="start">由关系变量与冒险选择触发</text><rect x="314" y="574" width="452" height="66" rx="16" class="surface2 border" /><text x="338" y="601" class="h3 ink" text-anchor="start">密信争夺</text><text x="338" y="624" class="small muted" text-anchor="start">允许交易 / 销毁 / 公开</text><rect x="314" y="666" width="452" height="66" rx="16" class="surface2 border" /><text x="338" y="693" class="h3 ink" text-anchor="start">旧案复盘</text><text x="338" y="716" class="small muted" text-anchor="start">不同角色看到不同证据链</text><rect x="830" y="324" width="536" height="520" rx="20" class="surface border shadow" /><text x="854" y="358" class="h3 ink" text-anchor="start">改编风险矩阵</text><text x="854" y="382" class="small muted" text-anchor="start">复杂度与体验风险</text><rect x="862" y="388" width="470" height="296" rx="14" class="surface border" /><rect x="862" y="388" width="470" height="59.2" rx="14" class="surface2" /><text x="878" y="422.6" class="small muted" text-anchor="start">风险</text><text x="1034.6666666666665" y="422.6" class="small muted" text-anchor="start">影响</text><text x="1191.3333333333333" y="422.6" class="small muted" text-anchor="start">处理</text><line x1="862" y1="447.2" x2="1332" y2="447.2" class="thin"/><text x="878" y="481.8" class="small ink" text-anchor="start">分支太晚</text><text x="1034.6666666666665" y="481.8" class="small ink" text-anchor="start">玩家中途无感</text><text x="1191.3333333333333" y="481.8" class="small ink" text-anchor="start">增加中段真实分歧</text><line x1="862" y1="506.4" x2="1332" y2="506.4" class="thin"/><text x="878" y="541.0" class="small ink" text-anchor="start">角色不平衡</text><text x="1034.6666666666665" y="541.0" class="small ink" text-anchor="start">多人无聊</text><text x="1191.3333333333333" y="541.0" class="small ink" text-anchor="start">补独占筹码</text><line x1="862" y1="565.6" x2="1332" y2="565.6" class="thin"/><text x="878" y="600.2" class="small ink" text-anchor="start">数值空转</text><text x="1034.6666666666665" y="600.2" class="small ink" text-anchor="start">选择无后果</text><text x="1191.3333333333333" y="600.2" class="small ink" text-anchor="start">绑定剧情池</text><line x1="862" y1="624.8" x2="1332" y2="624.8" class="thin"/><text x="878" y="659.4" class="small ink" text-anchor="start">线索不可达</text><text x="1034.6666666666665" y="659.4" class="small ink" text-anchor="start">推理断裂</text><text x="1191.3333333333333" y="659.4" class="small ink" text-anchor="start">加替代推进</text><line x1="1018.6666666666666" y1="388" x2="1018.6666666666666" y2="684" class="thin"/><line x1="1175.3333333333333" y1="388" x2="1175.3333333333333" y2="684" class="thin"/><rect x="862" y="716" width="470" height="78" rx="18" class="accentSoft" /><text x="888" y="754" class="body accentText" text-anchor="start">建议：优先做多人母体，再拆单人版叙事体验。</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
</svg>