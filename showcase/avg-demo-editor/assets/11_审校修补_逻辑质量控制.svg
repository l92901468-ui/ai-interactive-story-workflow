<g id="审校修补逻辑质量控制">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="609" class="nav accentText" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">审校修补 / 逻辑质量控制</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="392" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">问题列表</text><text x="306" y="166" class="small muted" text-anchor="start">按严重级别排序</text><rect x="314" y="164" width="328" height="70" rx="18" class="dangerSoft" /><text x="338" y="194" class="h3 danger" text-anchor="start">P0</text><text x="386" y="194" class="body ink" text-anchor="start">关键结局不可达</text><text x="386" y="216" class="small muted" text-anchor="start">点击查看定位与补丁</text><rect x="314" y="256" width="328" height="70" rx="18" class="dangerSoft" /><text x="338" y="286" class="h3 danger" text-anchor="start">P1</text><text x="386" y="286" class="body ink" text-anchor="start">合流 2 存在强行汇合</text><text x="386" y="308" class="small muted" text-anchor="start">点击查看定位与补丁</text><rect x="314" y="348" width="328" height="70" rx="18" class="warningSoft" /><text x="338" y="378" class="h3 warning" text-anchor="start">P1</text><text x="386" y="378" class="body ink" text-anchor="start">多人中段差异不足</text><text x="386" y="400" class="small muted" text-anchor="start">点击查看定位与补丁</text><rect x="314" y="440" width="328" height="70" rx="18" class="warningSoft" /><text x="338" y="470" class="h3 warning" text-anchor="start">P2</text><text x="386" y="470" class="body ink" text-anchor="start">emit_tags 未回收</text><text x="386" y="492" class="small muted" text-anchor="start">点击查看定位与补丁</text><rect x="314" y="532" width="328" height="70" rx="18" class="surface2" /><text x="338" y="562" class="h3 muted" text-anchor="start">P2</text><text x="386" y="562" class="body ink" text-anchor="start">角色 D 长期无事可做</text><text x="386" y="584" class="small muted" text-anchor="start">点击查看定位与补丁</text><rect x="706" y="108" width="660" height="408" rx="20" class="surface border shadow" /><text x="730" y="142" class="h3 ink" text-anchor="start">问题详情</text><text x="730" y="166" class="small muted" text-anchor="start">P1｜合流 2 存在强行汇合</text><text x="738" y="166" class="body ink" text-anchor="start">问题原因：玩家是否公开密信，对合流 2 的到达方式几乎没有影响。</text><text x="738" y="196" class="body ink" text-anchor="start">风险：中途选择被抹平，玩家只在结尾看到不同文本。</text><text x="738" y="226" class="body ink" text-anchor="start">定位：主线合流 / 账册公审 / ST-042</text><rect x="738" y="286" width="560" height="82" rx="18" class="dangerSoft" /><text x="766" y="322" class="body danger" text-anchor="start">结论：这是“中途几乎一致，只在结尾不同”的伪分支风险。</text><rect x="706" y="548" width="660" height="340" rx="20" class="surface border shadow" /><text x="730" y="582" class="h3 ink" text-anchor="start">自动修补建议</text><text x="730" y="606" class="small muted" text-anchor="start">最小改动，不推翻现有剧情</text><rect x="738" y="606" width="594" height="192" rx="14" class="surface border" /><rect x="738" y="606" width="594" height="48.0" rx="14" class="surface2" /><text x="754" y="635.0" class="small muted" text-anchor="start">补丁</text><text x="952.0" y="635.0" class="small muted" text-anchor="start">新增内容</text><text x="1150.0" y="635.0" class="small muted" text-anchor="start">效果</text><line x1="738" y1="654.0" x2="1332" y2="654.0" class="thin"/><text x="754" y="683.0" class="small ink" text-anchor="start">新增中段差异点</text><text x="952.0" y="683.0" class="small ink" text-anchor="start">密信归属影响证人站队</text><text x="1150.0" y="683.0" class="small ink" text-anchor="start">提前产生差分</text><line x1="738" y1="702.0" x2="1332" y2="702.0" class="thin"/><text x="754" y="731.0" class="small ink" text-anchor="start">修改触发条件</text><text x="952.0" y="731.0" class="small ink" text-anchor="start">letter_status 控制 ST-042 版本</text><text x="1150.0" y="731.0" class="small ink" text-anchor="start">避免强行汇合</text><line x1="738" y1="750.0" x2="1332" y2="750.0" class="thin"/><text x="754" y="779.0" class="small ink" text-anchor="start">补角色 D 权限</text><text x="952.0" y="779.0" class="small ink" text-anchor="start">D 可质疑证据合法性</text><text x="1150.0" y="779.0" class="small ink" text-anchor="start">增加多人博弈</text><line x1="936.0" y1="606" x2="936.0" y2="798" class="thin"/><line x1="1134.0" y1="606" x2="1134.0" y2="798" class="thin"/><rect x="738" y="822" width="594" height="42" rx="14" class="accentSoft" /><text x="766" y="849" class="small accentText" text-anchor="start">修补后预计：分支真实差异评分 5.8 → 7.6</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
