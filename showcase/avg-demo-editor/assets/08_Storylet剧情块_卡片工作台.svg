<g id="Storylet剧情块卡片工作台">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="483" class="nav accentText" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">Storylet 剧情块 / 卡片工作台</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="1084" height="110" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">Storylet 过滤器</text><text x="306" y="166" class="small muted" text-anchor="start">按类别、服务层级、触发条件、模式适配筛选</text><rect x="314" y="158" width="88" height="30" rx="15" class="accentSoft" /><text x="328" y="178.0" class="small accentText" text-anchor="start">全部</text><rect x="419" y="158" width="88" height="30" rx="15" class="surface2" /><text x="433" y="178.0" class="small muted" text-anchor="start">主线</text><rect x="524" y="158" width="88" height="30" rx="15" class="surface2" /><text x="538" y="178.0" class="small muted" text-anchor="start">支线</text><rect x="629" y="158" width="88" height="30" rx="15" class="surface2" /><text x="643" y="178.0" class="small muted" text-anchor="start">人物线</text><rect x="734" y="158" width="88" height="30" rx="15" class="surface2" /><text x="748" y="178.0" class="small muted" text-anchor="start">结局</text><rect x="839" y="158" width="88" height="30" rx="15" class="surface2" /><text x="853" y="178.0" class="small muted" text-anchor="start">公共</text><rect x="944" y="158" width="88" height="30" rx="15" class="surface2" /><text x="958" y="178.0" class="small muted" text-anchor="start">个人</text><rect x="1049" y="158" width="88" height="30" rx="15" class="surface2" /><text x="1063" y="178.0" class="small muted" text-anchor="start">关系</text><rect x="1154" y="158" width="88" height="30" rx="15" class="surface2" /><text x="1168" y="178.0" class="small muted" text-anchor="start">双模式</text><rect x="282" y="254" width="1084" height="634" rx="20" class="surface border shadow" /><text x="306" y="288" class="h3 ink" text-anchor="start">剧情块看板</text><text x="306" y="312" class="small muted" text-anchor="start">每张卡都含触发、选项、即时结果、延迟后果</text><text x="314" y="314" class="h3 ink" text-anchor="start">待细化</text><rect x="314" y="336" width="214" height="508" rx="20" class="surface2 border" /><text x="568" y="314" class="h3 ink" text-anchor="start">可审校</text><rect x="568" y="336" width="214" height="508" rx="20" class="surface2 border" /><text x="822" y="314" class="h3 ink" text-anchor="start">需返修</text><rect x="822" y="336" width="214" height="508" rx="20" class="surface2 border" /><text x="1076" y="314" class="h3 ink" text-anchor="start">已确认</text><rect x="1076" y="336" width="214" height="508" rx="20" class="surface2 border" /><rect x="330" y="366" width="182" height="150" rx="18" class="surface border" /><text x="346" y="398" class="h3 ink" text-anchor="start">ST-024 密信失踪</text><rect x="346" y="414" width="132" height="24" rx="12" class="accentSoft" /><text x="360" y="431.0" class="small accentText" text-anchor="start">主线 / 公共</text><text x="346" y="458" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="346" y="476" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="346" y="494" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="330" y="556" width="182" height="150" rx="18" class="surface border" /><text x="346" y="588" class="h3 ink" text-anchor="start">ST-031 夜间偷听</text><rect x="346" y="604" width="132" height="24" rx="12" class="purpleSoft" /><text x="360" y="621.0" class="small purple" text-anchor="start">人物线 / 个人</text><text x="346" y="648" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="346" y="666" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="346" y="684" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="584" y="366" width="182" height="150" rx="18" class="surface border" /><text x="600" y="398" class="h3 ink" text-anchor="start">ST-016 祠堂对质</text><rect x="600" y="414" width="132" height="24" rx="12" class="successSoft" /><text x="614" y="431.0" class="small success" text-anchor="start">主线 / 公共</text><text x="600" y="458" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="600" y="476" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="600" y="494" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="584" y="556" width="182" height="150" rx="18" class="surface border" /><text x="600" y="588" class="h3 ink" text-anchor="start">ST-038 私下交易</text><rect x="600" y="604" width="132" height="24" rx="12" class="cyanSoft" /><text x="614" y="621.0" class="small cyan" text-anchor="start">关系 / 多人</text><text x="600" y="648" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="600" y="666" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="600" y="684" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="838" y="366" width="182" height="150" rx="18" class="surface border" /><text x="854" y="398" class="h3 ink" text-anchor="start">ST-042 账册公审</text><rect x="854" y="414" width="132" height="24" rx="12" class="dangerSoft" /><text x="868" y="431.0" class="small danger" text-anchor="start">合流风险</text><text x="854" y="458" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="854" y="476" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="854" y="494" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="1092" y="366" width="182" height="150" rx="18" class="surface border" /><text x="1108" y="398" class="h3 ink" text-anchor="start">ST-009 初见旧友</text><rect x="1108" y="414" width="132" height="24" rx="12" class="successSoft" /><text x="1122" y="431.0" class="small success" text-anchor="start">已确认</text><text x="1108" y="458" class="tiny muted" text-anchor="start">触发：夜间 + 线索</text><text x="1108" y="476" class="tiny muted" text-anchor="start">选项：试探/交易/隐瞒</text><text x="1108" y="494" class="tiny muted" text-anchor="start">后果：开放后续池</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
