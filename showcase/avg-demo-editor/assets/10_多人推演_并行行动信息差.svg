<g id="多人推演并行行动信息差">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="567" class="nav accentText" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">多人推演 / 并行行动与信息差</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="1084" height="280" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">同一时间窗并行行动</text><text x="306" y="166" class="small muted" text-anchor="start">第 2 夜 / 时间窗 3</text><rect x="314" y="176" width="210" height="144" rx="20" class="surface2 border" /><text x="338" y="210" class="h3 ink" text-anchor="start">A 沈砚</text><rect x="338" y="232" width="110" height="24" rx="12" class="accentSoft" /><text x="352" y="249.0" class="small accentText" text-anchor="start">去书房</text><rect x="338" y="264" width="110" height="24" rx="12" class="surface" /><text x="352" y="281.0" class="small muted" text-anchor="start">私聊 C</text><rect x="338" y="296" width="110" height="24" rx="12" class="surface" /><text x="352" y="313.0" class="small muted" text-anchor="start">销毁证据</text><rect x="566" y="176" width="210" height="144" rx="20" class="surface2 border" /><text x="590" y="210" class="h3 ink" text-anchor="start">B 林澈</text><rect x="590" y="232" width="110" height="24" rx="12" class="accentSoft" /><text x="604" y="249.0" class="small accentText" text-anchor="start">跟踪 A</text><rect x="590" y="264" width="110" height="24" rx="12" class="surface" /><text x="604" y="281.0" class="small muted" text-anchor="start">联络 NPC</text><rect x="590" y="296" width="110" height="24" rx="12" class="surface" /><text x="604" y="313.0" class="small muted" text-anchor="start">公开质询</text><rect x="818" y="176" width="210" height="144" rx="20" class="surface2 border" /><text x="842" y="210" class="h3 ink" text-anchor="start">C 阿洛</text><rect x="842" y="232" width="110" height="24" rx="12" class="accentSoft" /><text x="856" y="249.0" class="small accentText" text-anchor="start">交易情报</text><rect x="842" y="264" width="110" height="24" rx="12" class="surface" /><text x="856" y="281.0" class="small muted" text-anchor="start">伪造证据</text><rect x="842" y="296" width="110" height="24" rx="12" class="surface" /><text x="856" y="313.0" class="small muted" text-anchor="start">打开密道</text><rect x="1070" y="176" width="210" height="144" rx="20" class="surface2 border" /><text x="1094" y="210" class="h3 ink" text-anchor="start">D 迟舟</text><rect x="1094" y="232" width="110" height="24" rx="12" class="accentSoft" /><text x="1108" y="249.0" class="small accentText" text-anchor="start">保护目标</text><rect x="1094" y="264" width="110" height="24" rx="12" class="surface" /><text x="1108" y="281.0" class="small muted" text-anchor="start">揭露身份</text><rect x="1094" y="296" width="110" height="24" rx="12" class="surface" /><text x="1108" y="313.0" class="small muted" text-anchor="start">抢夺密信</text><rect x="282" y="424" width="650" height="464" rx="20" class="surface border shadow" /><text x="306" y="458" class="h3 ink" text-anchor="start">玩家行为交叉影响表</text><text x="306" y="482" class="small muted" text-anchor="start">A 的行为如何改变 B/C/D 的空间</text><rect x="314" y="486" width="586" height="312" rx="14" class="surface border" /><rect x="314" y="486" width="586" height="62.4" rx="14" class="surface2" /><text x="330" y="522.2" class="small muted" text-anchor="start">A 的行为</text><text x="476.5" y="522.2" class="small muted" text-anchor="start">B 失去</text><text x="623.0" y="522.2" class="small muted" text-anchor="start">B 新增</text><text x="769.5" y="522.2" class="small muted" text-anchor="start">是否察觉</text><line x1="314" y1="548.4" x2="900" y2="548.4" class="thin"/><text x="330" y="584.6" class="small ink" text-anchor="start">私藏密信</text><text x="476.5" y="584.6" class="small ink" text-anchor="start">公开质询证据</text><text x="623.0" y="584.6" class="small ink" text-anchor="start">夜谈试探</text><text x="769.5" y="584.6" class="small ink" text-anchor="start">否</text><line x1="314" y1="610.8" x2="900" y2="610.8" class="thin"/><text x="330" y="647.0" class="small ink" text-anchor="start">烧毁残页</text><text x="476.5" y="647.0" class="small ink" text-anchor="start">账册复盘</text><text x="623.0" y="647.0" class="small ink" text-anchor="start">追杀线索</text><text x="769.5" y="647.0" class="small ink" text-anchor="start">是</text><line x1="314" y1="673.2" x2="900" y2="673.2" class="thin"/><text x="330" y="709.4000000000001" class="small ink" text-anchor="start">与 C 交易</text><text x="476.5" y="709.4000000000001" class="small ink" text-anchor="start">独占情报</text><text x="623.0" y="709.4000000000001" class="small ink" text-anchor="start">反交易机会</text><text x="769.5" y="709.4000000000001" class="small ink" text-anchor="start">否</text><line x1="314" y1="735.6" x2="900" y2="735.6" class="thin"/><text x="330" y="771.8000000000001" class="small ink" text-anchor="start">公开质问 B</text><text x="476.5" y="771.8000000000001" class="small ink" text-anchor="start">隐藏身份空间</text><text x="623.0" y="771.8000000000001" class="small ink" text-anchor="start">自证行动</text><text x="769.5" y="771.8000000000001" class="small ink" text-anchor="start">是</text><line x1="460.5" y1="486" x2="460.5" y2="798" class="thin"/><line x1="607.0" y1="486" x2="607.0" y2="798" class="thin"/><line x1="753.5" y1="486" x2="753.5" y2="798" class="thin"/><rect x="964" y="424" width="402" height="464" rx="20" class="surface border shadow" /><text x="988" y="458" class="h3 ink" text-anchor="start">信息差地图</text><text x="988" y="482" class="small muted" text-anchor="start">谁知道什么，谁误判什么</text><rect x="996" y="488" width="338" height="78" rx="18" class="surface2 border" /><text x="1022" y="516" class="h3 ink" text-anchor="start">沈砚</text><text x="1022" y="540" class="small success" text-anchor="start">知道密信残页位置</text><text x="1022" y="558" class="tiny danger" text-anchor="start">误判 B 已暴露</text><rect x="996" y="596" width="338" height="78" rx="18" class="surface2 border" /><text x="1022" y="624" class="h3 ink" text-anchor="start">林澈</text><text x="1022" y="648" class="small success" text-anchor="start">知道旧案证词</text><text x="1022" y="666" class="tiny danger" text-anchor="start">误判 A 是盟友</text><rect x="996" y="704" width="338" height="78" rx="18" class="surface2 border" /><text x="1022" y="732" class="h3 ink" text-anchor="start">阿洛</text><text x="1022" y="756" class="small success" text-anchor="start">知道密道</text><text x="1022" y="774" class="tiny danger" text-anchor="start">不知道交易代价</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
