</style></defs>
<g id="项目总览总控工作台">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="189" class="nav accentText" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">项目总览 / 总控工作台</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="520" height="260" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">当前项目状态卡</text><text x="306" y="166" class="small muted" text-anchor="start">总控 Agent 自动整理</text><text x="310" y="168" class="small muted" text-anchor="start">项目类型</text><text x="420" y="168" class="small ink" text-anchor="start">多人 AVG / 互动影游</text><text x="310" y="200" class="small muted" text-anchor="start">题材</text><text x="420" y="200" class="small ink" text-anchor="start">民国悬疑 / 谍战</text><text x="310" y="232" class="small muted" text-anchor="start">模式</text><text x="420" y="232" class="small ink" text-anchor="start">双模式：单人 + 多人</text><text x="310" y="264" class="small muted" text-anchor="start">玩家人数</text><text x="420" y="264" class="small ink" text-anchor="start">4 人</text><text x="310" y="296" class="small muted" text-anchor="start">当前阶段</text><text x="420" y="296" class="small ink" text-anchor="start">Storylet 草案审校前</text><text x="310" y="328" class="small muted" text-anchor="start">最重要问题</text><text x="420" y="328" class="small ink" text-anchor="start">中段差异是否真实</text><rect x="830" y="108" width="250" height="260" rx="20" class="surface border shadow" /><text x="854" y="142" class="h3 ink" text-anchor="start">完成度</text><text x="854" y="166" class="small muted" text-anchor="start">15 个 Agent 层级</text><text x="858" y="168" class="small ink" text-anchor="start">素材提取</text><rect x="950" y="156" width="90" height="8" rx="4" class="surface2" /><rect x="950" y="156" width="90.0" height="8" rx="4" class="success" /><text x="1054" y="168" class="small muted" text-anchor="start">100%</text><text x="858" y="210" class="small ink" text-anchor="start">世界角色</text><rect x="950" y="198" width="90" height="8" rx="4" class="surface2" /><rect x="950" y="198" width="72.0" height="8" rx="4" class="accent" /><text x="1054" y="210" class="small muted" text-anchor="start">80%</text><text x="858" y="252" class="small ink" text-anchor="start">变量规则</text><rect x="950" y="240" width="90" height="8" rx="4" class="surface2" /><rect x="950" y="240" width="57.6" height="8" rx="4" class="warning" /><text x="1054" y="252" class="small muted" text-anchor="start">64%</text><text x="858" y="294" class="small ink" text-anchor="start">审校修补</text><rect x="950" y="282" width="90" height="8" rx="4" class="surface2" /><rect x="950" y="282" width="27.0" height="8" rx="4" class="danger" /><text x="1054" y="294" class="small muted" text-anchor="start">30%</text><rect x="1104" y="108" width="262" height="260" rx="20" class="surface border shadow" /><text x="1128" y="142" class="h3 ink" text-anchor="start">下一步建议</text><text x="1128" y="166" class="small muted" text-anchor="start">AI 路由</text><text x="1130" y="166" class="body ink" text-anchor="start">调用：审校与修补 Agent</text><text x="1130" y="194" class="body ink" text-anchor="start">重点：伪分支 / 强行合流</text><text x="1130" y="222" class="body ink" text-anchor="start">输出：补丁方案 + 评分</text><text x="1130" y="250" class="body ink" text-anchor="start">追问：最多 2 个问题</text><rect x="282" y="400" width="676" height="480" rx="20" class="surface border shadow" /><text x="306" y="434" class="h3 ink" text-anchor="start">创作管线</text><text x="306" y="458" class="small muted" text-anchor="start">从输入到导出的可视化流程</text><rect x="320" y="476" width="126" height="74" rx="18" class="surface2 border" /><text x="342" y="506" class="h3 accentText" text-anchor="start">输入</text><text x="342" y="530" class="small muted" text-anchor="start">素材提取</text><line x1="452" y1="513" x2="466" y2="513" class="line" marker-end="url(#arrow)"/><rect x="472" y="476" width="126" height="74" rx="18" class="surface2 border" /><text x="494" y="506" class="h3 accentText" text-anchor="start">改编</text><text x="494" y="530" class="small muted" text-anchor="start">母体改造</text><line x1="604" y1="513" x2="618" y2="513" class="line" marker-end="url(#arrow)"/><rect x="624" y="476" width="126" height="74" rx="18" class="surface2 border" /><text x="646" y="506" class="h3 accentText" text-anchor="start">世界</text><text x="646" y="530" class="small muted" text-anchor="start">世界观</text><line x1="756" y1="513" x2="770" y2="513" class="line" marker-end="url(#arrow)"/><rect x="776" y="476" width="126" height="74" rx="18" class="surface2 border" /><text x="798" y="506" class="h3 accentText" text-anchor="start">角色</text><text x="798" y="530" class="small muted" text-anchor="start">阵营包</text><line x1="839" y1="560" x2="839" y2="608" class="line" marker-end="url(#arrow)"/><rect x="320" y="626" width="126" height="74" rx="18" class="surface2 border" /><text x="342" y="656" class="h3 accentText" text-anchor="start">结构</text><text x="342" y="680" class="small muted" text-anchor="start">主线合流</text><line x1="452" y1="663" x2="466" y2="663" class="line" marker-end="url(#arrow)"/><rect x="472" y="626" width="126" height="74" rx="18" class="surface2 border" /><text x="494" y="656" class="h3 accentText" text-anchor="start">系统</text><text x="494" y="680" class="small muted" text-anchor="start">变量触发</text><line x1="604" y1="663" x2="618" y2="663" class="line" marker-end="url(#arrow)"/><rect x="624" y="626" width="126" height="74" rx="18" class="surface2 border" /><text x="646" y="656" class="h3 accentText" text-anchor="start">内容</text><text x="646" y="680" class="small muted" text-anchor="start">Storylet</text><line x1="756" y1="663" x2="770" y2="663" class="line" marker-end="url(#arrow)"/><rect x="776" y="626" width="126" height="74" rx="18" class="surface2 border" /><text x="798" y="656" class="h3 accentText" text-anchor="start">质量</text><text x="798" y="680" class="small muted" text-anchor="start">审校修补</text><rect x="986" y="400" width="380" height="480" rx="20" class="surface border shadow" /><text x="1010" y="434" class="h3 ink" text-anchor="start">总控输入</text><text x="1010" y="458" class="small muted" text-anchor="start">自然语言 → 项目状态 → Agent 路由</text><rect x="1018" y="466" width="316" height="98" rx="16" class="surface2 border" /><text x="1042" y="506" class="body ink" text-anchor="start">“检查第 2 章分支，</text><text x="1042" y="530" class="body ink" text-anchor="start">是不是只是结尾不同？”</text><line x1="1176" y1="582" x2="1176" y2="638" class="line" marker-end="url(#arrow)"/><rect x="1018" y="650" width="316" height="158" rx="18" class="accentSoft" /><text x="1042" y="690" class="h3 accentText" text-anchor="start">识别层级：审校与修补</text><text x="1042" y="724" class="body ink" text-anchor="start">整理当前状态卡</text><text x="1042" y="748" class="body ink" text-anchor="start">调用审校 Agent</text><text x="1042" y="772" class="body ink" text-anchor="start">输出问题清单与补丁</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
