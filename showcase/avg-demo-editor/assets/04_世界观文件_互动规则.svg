<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="世界观文件互动规则">
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/></marker><style>
  .bg{fill:#F6F7F9}.surface{fill:#FFFFFF}.surface2{fill:#FAFBFC}.ink{fill:#111827}.muted{fill:#6B7280}.subtle{fill:#9CA3AF}.border{stroke:#E5E7EB;stroke-width:1}.border2{stroke:#D1D5DB;stroke-width:1}.accent{fill:#3366FF}.accentText{fill:#3366FF}.accentSoft{fill:#EAF0FF}.success{fill:#10B981}.successSoft{fill:#EAFBF4}.warning{fill:#F59E0B}.warningSoft{fill:#FFF7E6}.danger{fill:#EF4444}.dangerSoft{fill:#FEECEC}.purple{fill:#7C3AED}.purpleSoft{fill:#F2ECFF}.cyan{fill:#06B6D4}.cyanSoft{fill:#E9FBFF}.line{stroke:#CBD5E1;stroke-width:2}.thin{stroke:#E5E7EB;stroke-width:1}.dash{stroke-dasharray:6 6}.shadow{filter:url(#softShadow)}
  text{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;dominant-baseline:alphabetic}
  .h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px;font-weight:400}.small{font-size:12px}.tiny{font-size:11px}.nav{font-size:13px}.mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;font-size:12px}
</style></defs>
<g id="世界观文件互动规则">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="315" class="nav accentText" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">世界观文件 / 互动规则</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="640" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">世界观文档编辑器</text><text x="306" y="166" class="small muted" text-anchor="start">结构化编辑，不写成长篇小说</text><rect x="314" y="164" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="194" class="h3 ink" text-anchor="start">世界背景</text><text x="340" y="220" class="small muted" text-anchor="start">时代、地域、社会结构、信息传播方式</text><rect x="314" y="270" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="300" class="h3 ink" text-anchor="start">主题与体验目标</text><text x="340" y="326" class="small muted" text-anchor="start">权力、背叛、代价、真相</text><rect x="314" y="376" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="406" class="h3 ink" text-anchor="start">关键力量</text><text x="340" y="432" class="small muted" text-anchor="start">家族、商会、密探、旧案幸存者</text><rect x="314" y="482" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="512" class="h3 ink" text-anchor="start">关键资源</text><text x="340" y="538" class="small muted" text-anchor="start">情报、名望、兵符、密信、关系</text><rect x="314" y="588" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="618" class="h3 ink" text-anchor="start">行为约束</text><text x="340" y="644" class="small muted" text-anchor="start">礼制、法度、身份、禁忌</text><rect x="314" y="694" width="576" height="78" rx="18" class="surface2 border" /><text x="340" y="724" class="h3 ink" text-anchor="start">典型场景</text><text x="340" y="750" class="small muted" text-anchor="start">公共议事、密谈、交易、翻盘</text><rect x="950" y="108" width="416" height="780" rx="20" class="surface border shadow" /><text x="974" y="142" class="h3 ink" text-anchor="start">互动叙事要素</text><text x="974" y="166" class="small muted" text-anchor="start">推荐转化为变量 / 标记 / 伏笔</text><rect x="982" y="170" width="352" height="108" rx="20" class="accentSoft" /><text x="1010" y="208" class="h3 accentText" text-anchor="start">变量候选</text><text x="1010" y="238" class="small ink" text-anchor="start">声望、怀疑、信任、暴露风险</text><rect x="982" y="312" width="352" height="108" rx="20" class="warningSoft" /><text x="1010" y="350" class="h3 warning" text-anchor="start">事件标记</text><text x="1010" y="380" class="small ink" text-anchor="start">密信出现、灯灭、掌灯人失踪</text><rect x="982" y="454" width="352" height="108" rx="20" class="purpleSoft" /><text x="1010" y="492" class="h3 purple" text-anchor="start">长期伏笔</text><text x="1010" y="522" class="small ink" text-anchor="start">账册缺页、旧案幸存者、雨夜证词</text><rect x="982" y="596" width="352" height="108" rx="20" class="cyanSoft" /><text x="1010" y="634" class="h3 cyan" text-anchor="start">信息差来源</text><text x="1010" y="664" class="small ink" text-anchor="start">谁知道真相、谁误以为知道</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
</svg>