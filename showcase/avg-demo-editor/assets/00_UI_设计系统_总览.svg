<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="UI设计系统总览">
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/></marker><style>
  .bg{fill:#F6F7F9}.surface{fill:#FFFFFF}.surface2{fill:#FAFBFC}.ink{fill:#111827}.muted{fill:#6B7280}.subtle{fill:#9CA3AF}.border{stroke:#E5E7EB;stroke-width:1}.border2{stroke:#D1D5DB;stroke-width:1}.accent{fill:#3366FF}.accentText{fill:#3366FF}.accentSoft{fill:#EAF0FF}.success{fill:#10B981}.successSoft{fill:#EAFBF4}.warning{fill:#F59E0B}.warningSoft{fill:#FFF7E6}.danger{fill:#EF4444}.dangerSoft{fill:#FEECEC}.purple{fill:#7C3AED}.purpleSoft{fill:#F2ECFF}.cyan{fill:#06B6D4}.cyanSoft{fill:#E9FBFF}.line{stroke:#CBD5E1;stroke-width:2}.thin{stroke:#E5E7EB;stroke-width:1}.dash{stroke-dasharray:6 6}.shadow{filter:url(#softShadow)}
  text{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;dominant-baseline:alphabetic}
  .h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px;font-weight:400}.small{font-size:12px}.tiny{font-size:11px}.nav{font-size:13px}.mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;font-size:12px}
</style></defs>
<g id="UI设计系统总览">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><text x="64" y="70" class="h1 ink" text-anchor="start">AVG Studio UI Kit</text><text x="64" y="102" class="body muted" text-anchor="start">简约大方、可编辑 SVG 组件库：颜色、导航、卡片、表格、规则块、流程图。</text><rect x="64" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="82" y="174" width="52" height="52" rx="14" class="accent" /><text x="148" y="192" class="h3 ink" text-anchor="start">主色</text><text x="148" y="220" class="small muted" text-anchor="start">#3366FF</text><rect x="274" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="292" y="174" width="52" height="52" rx="14" class="bg" /><text x="358" y="192" class="h3 ink" text-anchor="start">背景</text><text x="358" y="220" class="small muted" text-anchor="start">#F6F7F9</text><rect x="484" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="502" y="174" width="52" height="52" rx="14" class="success" /><text x="568" y="192" class="h3 ink" text-anchor="start">成功</text><text x="568" y="220" class="small muted" text-anchor="start">#10B981</text><rect x="694" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="712" y="174" width="52" height="52" rx="14" class="warning" /><text x="778" y="192" class="h3 ink" text-anchor="start">警告</text><text x="778" y="220" class="small muted" text-anchor="start">#F59E0B</text><rect x="904" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="922" y="174" width="52" height="52" rx="14" class="danger" /><text x="988" y="192" class="h3 ink" text-anchor="start">危险</text><text x="988" y="220" class="small muted" text-anchor="start">#EF4444</text><rect x="1114" y="150" width="172" height="100" rx="18" class="surface border shadow" /><rect x="1132" y="174" width="52" height="52" rx="14" class="purple" /><text x="1198" y="192" class="h3 ink" text-anchor="start">紫色</text><text x="1198" y="220" class="small muted" text-anchor="start">#7C3AED</text><rect x="64" y="300" width="380" height="220" rx="20" class="surface border shadow" /><text x="88" y="334" class="h3 ink" text-anchor="start">组件：项目状态卡</text><text x="88" y="358" class="small muted" text-anchor="start">用于总控页右侧上下文</text><rect x="90" y="360" width="96" height="28" rx="14" class="successSoft" /><circle cx="104" cy="374.0" r="4" class="success"/><text x="115" y="379.0" class="small success" text-anchor="start">已完成</text><rect x="198" y="360" width="96" height="28" rx="14" class="warningSoft" /><circle cx="212" cy="374.0" r="4" class="warning"/><text x="223" y="379.0" class="small warning" text-anchor="start">需补充</text><rect x="306" y="360" width="96" height="28" rx="14" class="dangerSoft" /><circle cx="320" cy="374.0" r="4" class="danger"/><text x="331" y="379.0" class="small danger" text-anchor="start">高风险</text><text x="90" y="420" class="body ink" text-anchor="start">当前层级：Storylet / 剧情块</text><text x="90" y="446" class="body ink" text-anchor="start">推荐 Agent：剧情细化 Agent</text><text x="90" y="472" class="body ink" text-anchor="start">待补充：玩家人数、时间窗、核心冲突</text><rect x="480" y="300" width="410" height="220" rx="20" class="surface border shadow" /><text x="504" y="334" class="h3 ink" text-anchor="start">组件：规则块</text><text x="504" y="358" class="small muted" text-anchor="start">用于变量与触发规则</text><rect x="512" y="360" width="160" height="42" rx="12" class="accentSoft" /><text x="536" y="386" class="small accentText" text-anchor="start">IF 信任度 ≥ 60</text><line x1="682" y1="381" x2="748" y2="381" class="line" marker-end="url(#arrow)"/><rect x="760" y="360" width="98" height="42" rx="12" class="successSoft" /><text x="782" y="386" class="small success" text-anchor="start">开放剧情</text><rect x="512" y="424" width="160" height="42" rx="12" class="warningSoft" /><text x="536" y="450" class="small warning" text-anchor="start">AND 密信已获得</text><rect x="926" y="300" width="390" height="220" rx="20" class="surface border shadow" /><text x="950" y="334" class="h3 ink" text-anchor="start">组件：Storylet 卡</text><text x="950" y="358" class="small muted" text-anchor="start">用于剧情块编辑</text><text x="954" y="362" class="body ink" text-anchor="start">ST-024｜密信失踪</text><text x="954" y="388" class="body ink" text-anchor="start">触发：持有线索 + 夜间时间窗</text><text x="954" y="414" class="body ink" text-anchor="start">选项：试探 / 交易 / 销毁</text><text x="954" y="440" class="body ink" text-anchor="start">后果：开放夜谈，锁死公开质问</text><rect x="64" y="580" width="1252" height="340" rx="20" class="surface border shadow" /><text x="88" y="614" class="h3 ink" text-anchor="start">全流程信息架构</text><text x="88" y="638" class="small muted" text-anchor="start">左侧导航对应完整创作管线</text><rect x="106" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="172" y="694" class="h3 ink" text-anchor="middle">素材</text><line x1="248" y1="687" x2="284" y2="687" class="line" marker-end="url(#arrow)"/><rect x="298" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="364" y="694" class="h3 ink" text-anchor="middle">改编</text><line x1="440" y1="687" x2="476" y2="687" class="line" marker-end="url(#arrow)"/><rect x="490" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="556" y="694" class="h3 ink" text-anchor="middle">世界观</text><line x1="632" y1="687" x2="668" y2="687" class="line" marker-end="url(#arrow)"/><rect x="682" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="748" y="694" class="h3 ink" text-anchor="middle">角色</text><line x1="824" y1="687" x2="860" y2="687" class="line" marker-end="url(#arrow)"/><rect x="874" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="940" y="694" class="h3 ink" text-anchor="middle">主线</text><line x1="1016" y1="687" x2="1052" y2="687" class="line" marker-end="url(#arrow)"/><rect x="1066" y="660" width="132" height="54" rx="16" class="surface2 border" /><text x="1132" y="694" class="h3 ink" text-anchor="middle">变量</text><line x1="1132" y1="724" x2="1132" y2="752" class="line" marker-end="url(#arrow)"/><rect x="106" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="172" y="804" class="h3 ink" text-anchor="middle">Storylet</text><line x1="248" y1="797" x2="284" y2="797" class="line" marker-end="url(#arrow)"/><rect x="298" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="364" y="804" class="h3 ink" text-anchor="middle">选项</text><line x1="440" y1="797" x2="476" y2="797" class="line" marker-end="url(#arrow)"/><rect x="490" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="556" y="804" class="h3 ink" text-anchor="middle">后果</text><line x1="632" y1="797" x2="668" y2="797" class="line" marker-end="url(#arrow)"/><rect x="682" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="748" y="804" class="h3 ink" text-anchor="middle">审校</text><line x1="824" y1="797" x2="860" y2="797" class="line" marker-end="url(#arrow)"/><rect x="874" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="940" y="804" class="h3 ink" text-anchor="middle">预览</text><line x1="1016" y1="797" x2="1052" y2="797" class="line" marker-end="url(#arrow)"/><rect x="1066" y="770" width="132" height="54" rx="16" class="surface2 border" /><text x="1132" y="804" class="h3 ink" text-anchor="middle">导出</text>
</g>
</svg>