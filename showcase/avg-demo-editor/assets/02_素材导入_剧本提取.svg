<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="素材导入剧本提取">
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/></marker><style>
  .bg{fill:#F6F7F9}.surface{fill:#FFFFFF}.surface2{fill:#FAFBFC}.ink{fill:#111827}.muted{fill:#6B7280}.subtle{fill:#9CA3AF}.border{stroke:#E5E7EB;stroke-width:1}.border2{stroke:#D1D5DB;stroke-width:1}.accent{fill:#3366FF}.accentText{fill:#3366FF}.accentSoft{fill:#EAF0FF}.success{fill:#10B981}.successSoft{fill:#EAFBF4}.warning{fill:#F59E0B}.warningSoft{fill:#FFF7E6}.danger{fill:#EF4444}.dangerSoft{fill:#FEECEC}.purple{fill:#7C3AED}.purpleSoft{fill:#F2ECFF}.cyan{fill:#06B6D4}.cyanSoft{fill:#E9FBFF}.line{stroke:#CBD5E1;stroke-width:2}.thin{stroke:#E5E7EB;stroke-width:1}.dash{stroke-dasharray:6 6}.shadow{filter:url(#softShadow)}
  text{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;dominant-baseline:alphabetic}
  .h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px;font-weight:400}.small{font-size:12px}.tiny{font-size:11px}.nav{font-size:13px}.mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;font-size:12px}
</style></defs>
<g id="素材导入剧本提取">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="231" class="nav accentText" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">素材导入 / 剧本提取</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="490" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">原始素材</text><text x="306" y="166" class="small muted" text-anchor="start">上传剧本、梗概、参考资料</text><rect x="314" y="164" width="426" height="210" rx="20" class="surface2 border2 dash" /><text x="527" y="240" class="h3 muted" text-anchor="middle">拖拽 DOCX / PDF / TXT</text><text x="527" y="270" class="small subtle" text-anchor="middle">或粘贴剧本文本</text><text x="314" y="424" class="h3 ink" text-anchor="start">原文片段</text><rect x="314" y="448" width="426" height="352" rx="16" class="surface2 border" /><text x="338" y="486" class="body ink" text-anchor="start">夜半钟声响起，四名旧友在祠堂重逢。</text><text x="338" y="514" class="body ink" text-anchor="start">密信被发现时，掌灯人已经失踪。</text><text x="338" y="542" class="body ink" text-anchor="start">每个人都说自己没有离开正厅，</text><text x="338" y="570" class="body ink" text-anchor="start">但门闩上的泥痕证明有人撒谎……</text><rect x="314" y="828" width="130" height="38" rx="10" class="accent" /><text x="379.0" y="852.0" class="small surface" text-anchor="middle">开始提取</text><rect x="460" y="828" width="130" height="38" rx="10" class="surface border" /><text x="525.0" y="852.0" class="small ink" text-anchor="middle">仅保存草稿</text><rect x="804" y="108" width="562" height="780" rx="20" class="surface border shadow" /><text x="828" y="142" class="h3 ink" text-anchor="start">结构化提取结果</text><text x="828" y="166" class="small muted" text-anchor="start">可采纳 / 修改 / 忽略</text><rect x="836" y="164" width="498" height="160" rx="14" class="surface border" /><rect x="836" y="164" width="498" height="32.0" rx="14" class="surface2" /><text x="852" y="185.0" class="small muted" text-anchor="start">类别</text><text x="1018.0" y="185.0" class="small muted" text-anchor="start">字段</text><text x="1184.0" y="185.0" class="small muted" text-anchor="start">内容</text><line x1="836" y1="196.0" x2="1334" y2="196.0" class="thin"/><text x="852" y="217.0" class="small ink" text-anchor="start">基础</text><text x="1018.0" y="217.0" class="small ink" text-anchor="start">题材</text><text x="1184.0" y="217.0" class="small ink" text-anchor="start">悬疑 / 家族旧案</text><line x1="836" y1="228.0" x2="1334" y2="228.0" class="thin"/><text x="852" y="249.0" class="small ink" text-anchor="start">基础</text><text x="1018.0" y="249.0" class="small ink" text-anchor="start">核心事件</text><text x="1184.0" y="249.0" class="small ink" text-anchor="start">密信失踪与身份暴露</text><line x1="836" y1="260.0" x2="1334" y2="260.0" class="thin"/><text x="852" y="281.0" class="small ink" text-anchor="start">角色</text><text x="1018.0" y="281.0" class="small ink" text-anchor="start">关键人物</text><text x="1184.0" y="281.0" class="small ink" text-anchor="start">掌灯人、旧友 A/B/C/D</text><line x1="836" y1="292.0" x2="1334" y2="292.0" class="thin"/><text x="852" y="313.0" class="small ink" text-anchor="start">线索</text><text x="1018.0" y="313.0" class="small ink" text-anchor="start">道具</text><text x="1184.0" y="313.0" class="small ink" text-anchor="start">密信、门闩泥痕、账册</text><line x1="1002.0" y1="164" x2="1002.0" y2="324" class="thin"/><line x1="1168.0" y1="164" x2="1168.0" y2="324" class="thin"/><text x="836" y="360" class="h3 ink" text-anchor="start">角色提取</text><rect x="836" y="386" width="498" height="68" rx="16" class="surface2 border" /><text x="860" y="413" class="body ink" text-anchor="start">沈砚｜公开身份：账房</text><text x="860" y="436" class="small muted" text-anchor="start">筹码 / 关系 / 风险待确认</text><rect x="836" y="474" width="498" height="68" rx="16" class="surface2 border" /><text x="860" y="501" class="body ink" text-anchor="start">林澈｜隐藏动机：复仇</text><text x="860" y="524" class="small muted" text-anchor="start">筹码 / 关系 / 风险待确认</text><rect x="836" y="562" width="498" height="68" rx="16" class="surface2 border" /><text x="860" y="589" class="body ink" text-anchor="start">阿洛｜独占线索：半封密信</text><text x="860" y="612" class="small muted" text-anchor="start">筹码 / 关系 / 风险待确认</text><text x="836" y="680" class="h3 ink" text-anchor="start">缺失检查</text><rect x="836" y="710" width="326" height="30" rx="15" class="warningSoft" /><circle cx="850" cy="725.0" r="4" class="warning"/><text x="861" y="730.0" class="small warning" text-anchor="start">角色 B 的动机缺少证据链</text><rect x="836" y="752" width="326" height="30" rx="15" class="dangerSoft" /><circle cx="850" cy="767.0" r="4" class="danger"/><text x="861" y="772.0" class="small danger" text-anchor="start">关键反转只适合线下主持人解释</text><rect x="836" y="794" width="326" height="30" rx="15" class="warningSoft" /><circle cx="850" cy="809.0" r="4" class="warning"/><text x="861" y="814.0" class="small warning" text-anchor="start">第 3 个线索缺少回收点</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
</svg>