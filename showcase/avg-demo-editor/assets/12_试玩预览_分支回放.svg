<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-label="试玩预览分支回放">
<defs><filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#111827" flood-opacity="0.08"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/></marker><style>
  .bg{fill:#F6F7F9}.surface{fill:#FFFFFF}.surface2{fill:#FAFBFC}.ink{fill:#111827}.muted{fill:#6B7280}.subtle{fill:#9CA3AF}.border{stroke:#E5E7EB;stroke-width:1}.border2{stroke:#D1D5DB;stroke-width:1}.accent{fill:#3366FF}.accentText{fill:#3366FF}.accentSoft{fill:#EAF0FF}.success{fill:#10B981}.successSoft{fill:#EAFBF4}.warning{fill:#F59E0B}.warningSoft{fill:#FFF7E6}.danger{fill:#EF4444}.dangerSoft{fill:#FEECEC}.purple{fill:#7C3AED}.purpleSoft{fill:#F2ECFF}.cyan{fill:#06B6D4}.cyanSoft{fill:#E9FBFF}.line{stroke:#CBD5E1;stroke-width:2}.thin{stroke:#E5E7EB;stroke-width:1}.dash{stroke-dasharray:6 6}.shadow{filter:url(#softShadow)}
  text{font-family:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;dominant-baseline:alphabetic}
  .h1{font-size:28px;font-weight:700}.h2{font-size:20px;font-weight:700}.h3{font-size:16px;font-weight:700}.body{font-size:14px;font-weight:400}.small{font-size:12px}.tiny{font-size:11px}.nav{font-size:13px}.mono{font-family:"SFMono-Regular","Menlo","Consolas",monospace;font-size:12px}
</style></defs>
<g id="试玩预览分支回放">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="651" class="nav accentText" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">试玩预览 / 分支回放</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="380" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">玩家身份选择</text><text x="306" y="166" class="small muted" text-anchor="start">以不同玩家视角试玩</text><rect x="314" y="168" width="316" height="52" rx="16" class="accentSoft" /><text x="340" y="200" class="body accentText" text-anchor="start">沈砚｜账房先生</text><rect x="314" y="240" width="316" height="52" rx="16" class="surface2" /><text x="340" y="272" class="body muted" text-anchor="start">林澈｜归乡医者</text><rect x="314" y="312" width="316" height="52" rx="16" class="surface2" /><text x="340" y="344" class="body muted" text-anchor="start">阿洛｜掌灯助手</text><rect x="314" y="384" width="316" height="52" rx="16" class="surface2" /><text x="340" y="416" class="body muted" text-anchor="start">迟舟｜护院</text><text x="314" y="508" class="h3 ink" text-anchor="start">当前变量快照</text><rect x="314" y="536" width="316" height="188" rx="14" class="surface border" /><rect x="314" y="536" width="316" height="37.6" rx="14" class="surface2" /><text x="330" y="559.8" class="small muted" text-anchor="start">变量</text><text x="488.0" y="559.8" class="small muted" text-anchor="start">值</text><line x1="314" y1="573.6" x2="630" y2="573.6" class="thin"/><text x="330" y="597.4" class="small ink" text-anchor="start">trust_A_B</text><text x="488.0" y="597.4" class="small ink" text-anchor="start">72</text><line x1="314" y1="611.2" x2="630" y2="611.2" class="thin"/><text x="330" y="635.0" class="small ink" text-anchor="start">letter_status</text><text x="488.0" y="635.0" class="small ink" text-anchor="start">hidden</text><line x1="314" y1="648.8" x2="630" y2="648.8" class="thin"/><text x="330" y="672.5999999999999" class="small ink" text-anchor="start">time_window</text><text x="488.0" y="672.5999999999999" class="small ink" text-anchor="start">night_2</text><line x1="314" y1="686.4" x2="630" y2="686.4" class="thin"/><text x="330" y="710.1999999999999" class="small ink" text-anchor="start">ending_pool</text><text x="488.0" y="710.1999999999999" class="small ink" text-anchor="start">3 条</text><line x1="472.0" y1="536" x2="472.0" y2="724" class="thin"/><rect x="694" y="108" width="672" height="520" rx="20" class="surface border shadow" /><text x="718" y="142" class="h3 ink" text-anchor="start">互动预览</text><text x="718" y="166" class="small muted" text-anchor="start">玩家看到的叙事与选项</text><rect x="734" y="170" width="592" height="184" rx="20" class="surface2 border" /><text x="764" y="214" class="body ink" text-anchor="start">祠堂里只剩下你和半盏残灯。</text><text x="764" y="246" class="body ink" text-anchor="start">密信的一角露在灰烬中，</text><text x="764" y="278" class="body ink" text-anchor="start">门外脚步声停了一瞬，又远去。</text><rect x="734" y="390" width="592" height="54" rx="16" class="surface border" /><text x="764" y="424" class="body ink" text-anchor="start">公开密信，迫使所有人表态</text><rect x="734" y="462" width="592" height="54" rx="16" class="accentSoft" /><text x="764" y="496" class="body accentText" text-anchor="start">将密信藏入袖中，等待交易机会</text><rect x="734" y="534" width="592" height="54" rx="16" class="dangerSoft" /><text x="764" y="568" class="body danger" text-anchor="start">烧毁残页，切断证据链</text><rect x="694" y="660" width="672" height="228" rx="20" class="surface border shadow" /><text x="718" y="694" class="h3 ink" text-anchor="start">分支回放 / 差分解释</text><text x="718" y="718" class="small muted" text-anchor="start">为什么触发，为什么没触发</text><text x="734" y="716" class="body ink" text-anchor="start">已触发：ST-024 夜谈试探，因为 trust_A_B ≥ 60 且 letter_found = true。</text><text x="734" y="742" class="body ink" text-anchor="start">未触发：ST-019 公开质问，因为 letter_status = hidden。</text><text x="734" y="768" class="body ink" text-anchor="start">差异起点：选择“私藏密信”后，公共质询线被锁死。</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
</svg>