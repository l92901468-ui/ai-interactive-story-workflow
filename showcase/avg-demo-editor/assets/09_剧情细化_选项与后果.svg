</style></defs>
<g id="剧情细化选项与后果">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="surface" /><text x="42" y="357" class="nav muted" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="525" class="nav accentText" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">剧情细化 / 选项与后果</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="480" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">剧情块详情</text><text x="306" y="166" class="small muted" text-anchor="start">ST-024｜密信失踪</text><text x="314" y="166" class="h3 ink" text-anchor="start">核心目的</text><rect x="314" y="190" width="416" height="88" rx="16" class="surface2 border" /><text x="338" y="224" class="body ink" text-anchor="start">让玩家发现密信不是“线索物”，</text><text x="338" y="248" class="body ink" text-anchor="start">而是可以争夺、销毁、公开的关键资源。</text><text x="314" y="324" class="h3 ink" text-anchor="start">简版剧情正文</text><rect x="314" y="348" width="416" height="170" rx="16" class="surface2 border" /><text x="338" y="386" class="body ink" text-anchor="start">祠堂灯火忽明忽暗。</text><text x="338" y="412" class="body ink" text-anchor="start">沈砚发现供桌暗格被撬开，</text><text x="338" y="438" class="body ink" text-anchor="start">半封密信落在灰烬里。</text><text x="338" y="464" class="body ink" text-anchor="start">门外有人停步，却没有进来。</text><text x="314" y="568" class="h3 ink" text-anchor="start">情绪走向</text><rect x="314" y="592" width="416" height="88" rx="16" class="accentSoft" /><text x="338" y="628" class="body accentText" text-anchor="start">安静 → 怀疑 → 试探 → 紧张</text><rect x="794" y="108" width="572" height="780" rx="20" class="surface border shadow" /><text x="818" y="142" class="h3 ink" text-anchor="start">选项与后果表</text><text x="818" y="166" class="small muted" text-anchor="start">每个选择都有短期收益与长期代价</text><rect x="826" y="164" width="508" height="300" rx="14" class="surface border" /><rect x="826" y="164" width="508" height="60.0" rx="14" class="surface2" /><text x="842" y="199.0" class="small muted" text-anchor="start">选项</text><text x="969.0" y="199.0" class="small muted" text-anchor="start">意图</text><text x="1096.0" y="199.0" class="small muted" text-anchor="start">即时后果</text><text x="1223.0" y="199.0" class="small muted" text-anchor="start">远期影响</text><line x1="826" y1="224.0" x2="1334" y2="224.0" class="thin"/><text x="842" y="259.0" class="small ink" text-anchor="start">公开密信</text><text x="969.0" y="259.0" class="small ink" text-anchor="start">压迫</text><text x="1096.0" y="259.0" class="small ink" text-anchor="start">全员知晓</text><text x="1223.0" y="259.0" class="small ink" text-anchor="start">开放质询线</text><line x1="826" y1="284.0" x2="1334" y2="284.0" class="thin"/><text x="842" y="319.0" class="small ink" text-anchor="start">私藏密信</text><text x="969.0" y="319.0" class="small ink" text-anchor="start">冒险</text><text x="1096.0" y="319.0" class="small ink" text-anchor="start">获得筹码</text><text x="1223.0" y="319.0" class="small ink" text-anchor="start">提高暴露风险</text><line x1="826" y1="344.0" x2="1334" y2="344.0" class="thin"/><text x="842" y="379.0" class="small ink" text-anchor="start">与 B 交易</text><text x="969.0" y="379.0" class="small ink" text-anchor="start">操控</text><text x="1096.0" y="379.0" class="small ink" text-anchor="start">换取证词</text><text x="1223.0" y="379.0" class="small ink" text-anchor="start">关系变量变化</text><line x1="826" y1="404.0" x2="1334" y2="404.0" class="thin"/><text x="842" y="439.0" class="small ink" text-anchor="start">烧毁残页</text><text x="969.0" y="439.0" class="small ink" text-anchor="start">掩盖</text><text x="1096.0" y="439.0" class="small ink" text-anchor="start">锁死线索</text><text x="1223.0" y="439.0" class="small ink" text-anchor="start">引发追杀线</text><line x1="953.0" y1="164" x2="953.0" y2="464" class="thin"/><line x1="1080.0" y1="164" x2="1080.0" y2="464" class="thin"/><line x1="1207.0" y1="164" x2="1207.0" y2="464" class="thin"/><text x="826" y="510" class="h3 ink" text-anchor="start">数值变化预览</text><text x="826" y="548" class="small ink" text-anchor="start">trust_A_B</text><text x="1030" y="548" class="small muted" text-anchor="start">62</text><line x1="1070" y1="543" x2="1116" y2="543" class="thin" marker-end="url(#arrow)"/><text x="1154" y="548" class="small ink" text-anchor="start">72</text><circle cx="1280" cy="542" r="5" class="success"/><text x="826" y="602" class="small ink" text-anchor="start">exposure_A</text><text x="1030" y="602" class="small muted" text-anchor="start">18</text><line x1="1070" y1="597" x2="1116" y2="597" class="thin" marker-end="url(#arrow)"/><text x="1154" y="602" class="small ink" text-anchor="start">46</text><circle cx="1280" cy="596" r="5" class="warning"/><text x="826" y="656" class="small ink" text-anchor="start">letter_status</text><text x="1030" y="656" class="small muted" text-anchor="start">found</text><line x1="1070" y1="651" x2="1116" y2="651" class="thin" marker-end="url(#arrow)"/><text x="1154" y="656" class="small ink" text-anchor="start">hidden</text><circle cx="1280" cy="650" r="5" class="accent"/><text x="826" y="710" class="small ink" text-anchor="start">ending_betrayal_factor</text><text x="1030" y="710" class="small muted" text-anchor="start">0</text><line x1="1070" y1="705" x2="1116" y2="705" class="thin" marker-end="url(#arrow)"/><text x="1154" y="710" class="small ink" text-anchor="start">1</text><circle cx="1280" cy="704" r="5" class="purple"/><rect x="826" y="792" width="508" height="54" rx="16" class="dangerSoft" /><text x="852" y="826" class="small danger" text-anchor="start">质量提示：烧毁残页的代价需要再明显一点。</text><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
</g>
