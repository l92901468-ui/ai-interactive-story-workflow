<g id="角色阵营信息差筹码">
<rect x="0" y="0" width="1440" height="1024" rx="0" class="bg" /><rect x="0" y="0" width="250" height="1024" rx="0" class="surface border" /><text x="32" y="46" class="h2 ink" text-anchor="start">AVG Studio</text><text x="32" y="70" class="small muted" text-anchor="start">互动影游创作工作台</text><rect x="24" y="96" width="202" height="48" rx="14" class="accentSoft" /><text x="44" y="126" class="small accentText" text-anchor="start">项目：未命名影游</text><rect x="20" y="166" width="210" height="36" rx="10" class="surface" /><text x="42" y="189" class="nav muted" text-anchor="start">01  总览</text><rect x="20" y="208" width="210" height="36" rx="10" class="surface" /><text x="42" y="231" class="nav muted" text-anchor="start">02  素材提取</text><rect x="20" y="250" width="210" height="36" rx="10" class="surface" /><text x="42" y="273" class="nav muted" text-anchor="start">03  改编策略</text><rect x="20" y="292" width="210" height="36" rx="10" class="surface" /><text x="42" y="315" class="nav muted" text-anchor="start">04  世界观</text><rect x="20" y="334" width="210" height="36" rx="10" class="accentSoft" /><text x="42" y="357" class="nav accentText" text-anchor="start">05  角色阵营</text><rect x="20" y="376" width="210" height="36" rx="10" class="surface" /><text x="42" y="399" class="nav muted" text-anchor="start">06  主线合流</text><rect x="20" y="418" width="210" height="36" rx="10" class="surface" /><text x="42" y="441" class="nav muted" text-anchor="start">07  变量规则</text><rect x="20" y="460" width="210" height="36" rx="10" class="surface" /><text x="42" y="483" class="nav muted" text-anchor="start">08  Storylet</text><rect x="20" y="502" width="210" height="36" rx="10" class="surface" /><text x="42" y="525" class="nav muted" text-anchor="start">09  选项后果</text><rect x="20" y="544" width="210" height="36" rx="10" class="surface" /><text x="42" y="567" class="nav muted" text-anchor="start">10  多人推演</text><rect x="20" y="586" width="210" height="36" rx="10" class="surface" /><text x="42" y="609" class="nav muted" text-anchor="start">11  审校修补</text><rect x="20" y="628" width="210" height="36" rx="10" class="surface" /><text x="42" y="651" class="nav muted" text-anchor="start">12  试玩预览</text><rect x="20" y="670" width="210" height="36" rx="10" class="surface" /><text x="42" y="693" class="nav muted" text-anchor="start">13  导出</text><line x1="250" y1="0" x2="250" y2="1024" class="thin"/><rect x="250" y="0" width="1190" height="76" rx="0" class="surface border" /><text x="282" y="48" class="h1 ink" text-anchor="start">角色阵营 / 信息差与筹码</text><rect x="1010" y="24" width="120" height="30" rx="15" class="successSoft" /><circle cx="1024" cy="39.0" r="4" class="success"/><text x="1035" y="44.0" class="small success" text-anchor="start">草稿同步中</text><rect x="1150" y="22" width="110" height="34" rx="10" class="surface border" /><text x="1205.0" y="44.0" class="small ink" text-anchor="middle">预览</text><rect x="1276" y="22" width="120" height="34" rx="10" class="accent" /><text x="1336.0" y="44.0" class="small surface" text-anchor="middle">AI 总控</text><rect x="282" y="108" width="510" height="780" rx="20" class="surface border shadow" /><text x="306" y="142" class="h3 ink" text-anchor="start">玩家角色卡</text><text x="306" y="166" class="small muted" text-anchor="start">每个角色都要有信息差、筹码、风险</text><rect x="314" y="164" width="446" height="172" rx="20" class="surface2 border" /><circle cx="354" cy="206" r="22" class="accentSoft"/><text x="354" y="213" class="h3 accentText" text-anchor="middle">沈</text><text x="390" y="202" class="h3 ink" text-anchor="start">沈砚</text><text x="390" y="230" class="small muted" text-anchor="start">公开：账房先生</text><text x="390" y="258" class="small muted" text-anchor="start">隐藏：旧案证人</text><text x="390" y="286" class="small muted" text-anchor="start">筹码：账册残页</text><rect x="390" y="302" width="120" height="28" rx="14" class="successSoft" /><circle cx="404" cy="316.0" r="4" class="success"/><text x="415" y="321.0" class="small success" text-anchor="start">可玩性良好</text><rect x="314" y="378" width="446" height="172" rx="20" class="surface2 border" /><circle cx="354" cy="420" r="22" class="accentSoft"/><text x="354" y="427" class="h3 accentText" text-anchor="middle">林</text><text x="390" y="416" class="h3 ink" text-anchor="start">林澈</text><text x="390" y="444" class="small muted" text-anchor="start">公开：归乡医者</text><text x="390" y="472" class="small muted" text-anchor="start">隐藏：复仇者</text><text x="390" y="500" class="small muted" text-anchor="start">筹码：药方与证词</text><rect x="390" y="516" width="120" height="28" rx="14" class="successSoft" /><circle cx="404" cy="530.0" r="4" class="success"/><text x="415" y="535.0" class="small success" text-anchor="start">可玩性良好</text><rect x="314" y="592" width="446" height="172" rx="20" class="surface2 border" /><circle cx="354" cy="634" r="22" class="accentSoft"/><text x="354" y="641" class="h3 accentText" text-anchor="middle">阿</text><text x="390" y="630" class="h3 ink" text-anchor="start">阿洛</text><text x="390" y="658" class="small muted" text-anchor="start">公开：掌灯助手</text><text x="390" y="686" class="small muted" text-anchor="start">隐藏：被胁迫者</text><text x="390" y="714" class="small muted" text-anchor="start">筹码：密道路线</text><rect x="390" y="730" width="120" height="28" rx="14" class="successSoft" /><circle cx="404" cy="744.0" r="4" class="success"/><text x="415" y="749.0" class="small success" text-anchor="start">可玩性良好</text><rect x="824" y="108" width="542" height="450" rx="20" class="surface border shadow" /><text x="848" y="142" class="h3 ink" text-anchor="start">阵营关系图</text><text x="848" y="166" class="small muted" text-anchor="start">公开关系 / 隐性关系 / 可翻转关系</text><rect x="980" y="204" width="120" height="52" rx="26" class="accentSoft" /><text x="1040" y="236" class="small accentText" text-anchor="middle">家族</text><rect x="860" y="324" width="120" height="52" rx="26" class="warningSoft" /><text x="920" y="356" class="small warning" text-anchor="middle">商会</text><rect x="1100" y="324" width="120" height="52" rx="26" class="purpleSoft" /><text x="1160" y="356" class="small purple" text-anchor="middle">密探</text><rect x="980" y="444" width="120" height="52" rx="26" class="dangerSoft" /><text x="1040" y="476" class="small danger" text-anchor="middle">旧案幸存者</text><line x1="1040" y1="256" x2="920" y2="324" class="line" marker-end="url(#arrow)"/><line x1="1040" y1="256" x2="1160" y2="324" class="line" marker-end="url(#arrow)"/><line x1="920" y1="376" x2="1040" y2="444" class="line dash" marker-end="url(#arrow)"/><line x1="1160" y1="376" x2="1040" y2="444" class="line dash" marker-end="url(#arrow)"/><line x1="920" y1="350" x2="1160" y2="350" class="line dash"/><rect x="824" y="590" width="542" height="298" rx="20" class="surface border shadow" /><text x="848" y="624" class="h3 ink" text-anchor="start">角色平衡检查</text><text x="848" y="648" class="small muted" text-anchor="start">自动指出最弱角色与补强方向</text><rect x="856" y="652" width="478" height="174" rx="14" class="surface border" /><rect x="856" y="652" width="478" height="43.5" rx="14" class="surface2" /><text x="872" y="678.75" class="small muted" text-anchor="start">角色</text><text x="1031.3333333333335" y="678.75" class="small muted" text-anchor="start">问题</text><text x="1190.6666666666667" y="678.75" class="small muted" text-anchor="start">补强</text><line x1="856" y1="695.5" x2="1334" y2="695.5" class="thin"/><text x="872" y="722.25" class="small ink" text-anchor="start">阿洛</text><text x="1031.3333333333335" y="722.25" class="small ink" text-anchor="start">行动权限偏少</text><text x="1190.6666666666667" y="722.25" class="small ink" text-anchor="start">增加密道/偷听权限</text><line x1="856" y1="739.0" x2="1334" y2="739.0" class="thin"/><text x="872" y="765.75" class="small ink" text-anchor="start">林澈</text><text x="1031.3333333333335" y="765.75" class="small ink" text-anchor="start">目标过直</text><text x="1190.6666666666667" y="765.75" class="small ink" text-anchor="start">加入道德代价</text><line x1="856" y1="782.5" x2="1334" y2="782.5" class="thin"/><text x="872" y="809.25" class="small ink" text-anchor="start">沈砚</text><text x="1031.3333333333335" y="809.25" class="small ink" text-anchor="start">信息过强</text><text x="1190.6666666666667" y="809.25" class="small ink" text-anchor="start">增加暴露风险</text><line x1="1015.3333333333334" y1="652" x2="1015.3333333333334" y2="826" class="thin"/><line x1="1174.6666666666667" y1="652" x2="1174.6666666666667" y2="826" class="thin"/><rect x="282" y="932" width="1084" height="60" rx="18" class="surface border shadow" /><text x="310" y="970" class="body muted" text-anchor="start">输入想法，例如：检查第 2 章是否存在伪分支，或把这个节点改成多人博弈……</text><rect x="1248" y="946" width="96" height="34" rx="10" class="accent" /><text x="1296.0" y="968.0" class="small surface" text-anchor="middle">发送</text>
